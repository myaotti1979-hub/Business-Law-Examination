<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>法務検定 学習</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161a;--ink2:#4a4a5a;--bg:#f7f4ee;--bg2:#ece6d8;--bl:#1a3a5c;--bl2:#2d6a9f;--gd:#9e7c0c;--ok:#1b6b3a;--ok2:#d4edda;--ng:#8b1a1a;--ng2:#f8d7da;--or:#c26a00;--or2:#fff3cd;--r:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:780px;margin:0 auto;padding:16px 14px 90px}
.hdr{text-align:center;padding:22px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:22px;position:relative}
.hdr::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:60px;height:2px;background:var(--gd)}
.hdr h1{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:900;letter-spacing:5px}
.hdr p{font-size:19px;color:var(--ink2);letter-spacing:2px;margin-top:2px}
.bc{display:flex;align-items:center;gap:5px;margin-bottom:14px;font-size:19px;color:var(--ink2);flex-wrap:wrap}
.bc a{color:var(--bl2);cursor:pointer;text-decoration:underline}
.tg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:18px;font-weight:700;margin:0 2px}
.tg-b{background:#e8f0fe;color:var(--bl)}.tg-r{background:var(--ng2);color:var(--ng)}.tg-y{background:#fef3cd;color:#856404}.tg-g{background:var(--ok2);color:var(--ok)}.tg-o{background:var(--or2);color:var(--or)}
.info{padding:11px;background:#fff;border:1px solid var(--bg2);border-radius:var(--r);margin-bottom:14px;font-size:18px;line-height:1.8;color:var(--ink2)}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:10px}
.card{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:20px 10px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}
.card h2{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:900;margin-bottom:3px}
.card.c2 h2{color:var(--bl)}.card.c1 h2{color:var(--ng)}.card.ct h2{color:var(--or);font-size:26px}
.card p{font-size:19px;color:var(--ink2)}.card .cnt{font-size:18px;color:var(--ink2);margin-top:3px}
.ml{display:flex;flex-direction:column;gap:7px}
.cb{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid var(--bg2);border-radius:var(--r);padding:11px 13px;cursor:pointer;font-size:19px;color:var(--ink);text-align:left;width:100%;font-family:inherit;transition:.15s}
.cb:hover{border-color:var(--ink)}.cb .n{font-size:19px;color:var(--ink2);white-space:nowrap;margin-left:8px}
.cb.all{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}.cb.all .n{color:rgba(255,255,255,.6)}
.cb.or{background:var(--or);color:#fff;border-color:var(--or);font-weight:600}
.pbar{width:100%;height:4px;background:var(--bg2);border-radius:3px;margin-bottom:12px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}
.pf2{background:var(--bl)}.pf1{background:var(--ng)}.pft{background:var(--or)}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.qn{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;color:var(--ink2)}
.qs{font-size:19px;color:var(--gd);font-weight:600}
.tmr{margin-left:auto;font-size:19px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qt{font-size:19px;line-height:1.9;margin-bottom:14px;padding:13px;background:#fff;border-left:3px solid var(--gd);border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap}
.stmts{margin-bottom:12px;padding:9px 13px;background:#fff;border-radius:var(--r);border:1px solid var(--bg2)}
.stm{font-size:18px;line-height:1.8;padding:4px 0;border-bottom:1px dashed var(--bg2)}.stm:last-child{border-bottom:none}
.chs{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ch{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;background:#fff;border:1.5px solid var(--bg2);border-radius:var(--r);cursor:pointer;font-size:18px;line-height:1.7;color:var(--ink);text-align:left;font-family:inherit;width:100%;transition:.15s}
.ch:hover:not(.lk){border-color:var(--bl2);background:#f0f4f8}
.ch.sel{border-color:var(--bl);background:#e8f0fe}.ch.ok{border-color:var(--ok);background:var(--ok2)}.ch.ng{border-color:var(--ng);background:var(--ng2)}
.mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;border:2px solid var(--bg2);background:var(--bg);color:var(--ink2);margin-top:1px}
.ch.sel .mk{border-color:var(--bl);background:var(--bl);color:#fff}.ch.ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}.ch.ng .mk{border-color:var(--ng);background:var(--ng);color:#fff}
.exp{padding:12px;border-radius:var(--r);margin-bottom:12px;font-size:18px;line-height:1.9;animation:fi .3s}
.eok{background:var(--ok2);border:1px solid var(--ok)}.eng{background:var(--ng2);border:1px solid var(--ng)}
.el{font-weight:700;margin-bottom:3px;font-size:19px}.eok .el{color:var(--ok)}.eng .el{color:var(--ng)}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.br{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}
.btn{padding:8px 18px;border:none;border-radius:var(--r);font-family:inherit;font-size:18px;font-weight:600;cursor:pointer;transition:.15s}
.bp{background:var(--ink);color:#fff}.bp:hover{opacity:.85}.bp:disabled{background:var(--bg2);color:#aaa;cursor:not-allowed}
.bo{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}.bo:hover{background:var(--bg)}
.bg{background:var(--bl);color:#fff}.bor{background:var(--or);color:#fff}
.rc{text-align:center;padding:28px 12px;background:#fff;border:2px solid var(--ink);border-radius:var(--r);margin-bottom:14px}
.rs{font-family:'Noto Serif JP',serif;font-size:46px;font-weight:900;line-height:1}.rs span{font-size:20px;color:var(--ink2)}
.rl{margin-top:5px;font-size:18px;color:var(--ink2)}.rm{margin-top:6px;font-size:18px;color:var(--ink2)}
.rp{margin-top:3px;font-size:19px;font-weight:700}.rph{color:var(--ok)}.rpm{color:var(--gd)}.rpl{color:var(--ng)}
.stitle{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin-bottom:10px}
.ctr{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.rvl{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.rvi{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff;border-radius:var(--r);border:1px solid var(--bg2);cursor:pointer;font-size:18px}
.rvi:hover{border-color:var(--ink2)}.rvd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rvd.ok{background:var(--ok)}.rvd.ng{background:var(--ng)}
.rvt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvp{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;margin-bottom:14px;animation:fi .3s}
.sq{font-size:19px;line-height:1.8;font-weight:600;margin:12px 0 5px}
.ta{width:100%;min-height:110px;padding:9px;border:1.5px solid var(--bg2);border-radius:var(--r);font-family:inherit;font-size:18px;line-height:1.8;resize:vertical;background:#fff;color:var(--ink)}.ta:focus{outline:none;border-color:var(--bl)}.ta-sm{min-height:65px}
.mdl{padding:12px;background:#fdf6e3;border:1px solid var(--gd);border-radius:var(--r);margin-top:12px;font-size:18px;line-height:1.9;white-space:pre-wrap}
.ml2{font-family:'Noto Serif JP',serif;font-weight:700;color:var(--gd);margin-bottom:5px;font-size:19px}
.inp{width:100%;padding:9px;border:1.5px solid var(--bg2);border-radius:var(--r);font-family:inherit;font-size:19px;background:#fff}.inp:focus{outline:none;border-color:var(--bl)}
.grd{padding:14px;background:#fff;border:2px solid var(--bl);border-radius:var(--r);margin-top:12px;font-size:18px;line-height:1.8;animation:fi .3s}
.gs{display:flex;align-items:baseline;gap:5px;margin-bottom:8px}
.gsc{font-family:'Noto Serif JP',serif;font-size:34px;font-weight:900;color:var(--bl)}.gsu{font-size:19px;color:var(--ink2)}
.glv{padding:2px 9px;border-radius:20px;font-size:18px;font-weight:700}
.glv-A{background:var(--ok2);color:var(--ok)}.glv-B{background:#fef3cd;color:#856404}.glv-C{background:var(--ng2);color:var(--ng)}.glv-D{background:#f5c6cb;color:#721c24}
.gbd{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:10px;padding:7px;background:#f8f6f0;border-radius:6px;font-size:19px}
.gse{padding:8px;border:1px solid var(--bg2);border-radius:6px;margin-bottom:6px;font-size:18px;line-height:1.7}
.advice{padding:14px;background:#fff;border:2px solid var(--or);border-radius:var(--r);margin-bottom:14px;font-size:18px;line-height:1.9}
.advice h3{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--or);margin-bottom:6px}
.lawref{margin-top:7px}.lawbtn{background:none;border:1px solid var(--gd);border-radius:4px;padding:2px 9px;font-size:19px;color:var(--gd);cursor:pointer;font-family:inherit;font-weight:600}
.lawbox{margin-top:5px;padding:9px;background:#fffbf0;border:1px solid var(--gd);border-radius:6px;font-size:19px;line-height:1.8}
.lawbox b{color:var(--gd)}.sbtn{display:block;margin:14px auto 0;background:none;border:1px solid var(--bg2);border-radius:var(--r);padding:7px 18px;font-size:18px;color:var(--ink2);cursor:pointer;font-family:inherit}
.sbtn:hover{border-color:var(--ink)}
.offline-badge{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:4px 14px;border-radius:20px;font-size:19px;z-index:99;display:none}
body.offline .offline-badge{display:block}
</style>
</head>
<body>
<div class="offline-badge">📴 オフラインモード</div>
<div id="app" class="app">
  <div class="hdr"><h1>法務検定 学習</h1><p>ビジネス実務法務検定試験® 学習＆演習 <span style="color:#9e7c0c">v6.1</span></p></div>
  <div style="text-align:center;padding:40px;color:var(--ink2)">読み込み中...</div>
</div>

<script>
// ═══ App State ═══
const S = {
  view: 'home', data: {}, laws: {},
  apiKey: '', apiKeyPro: '', keyInput: '', keyInputPro: '', geminiModel: 'gemini-3.1-flash-lite',
  // quiz
  qs: [], ci: 0, sel: null, answered: false, score: 0, hist: [], revI: null,
  // grade1
  g1qs: [], g1ci: 0, essay: ['','',''], showMdl: false, g1hist: [], grading: false, gradeRes: null,
  // training
  trQs: [], trCi: 0, trSel: [], trDone: false, trScore: 0, trHist: [], trAns: '',
  // timer
  elapsed: 0, running: false, timerId: null,
  // progress tracking
  progress: { g2: {}, streak: 0, lastDate: '', totalSessions: 0 },
  // textbook
  textCh: 1, textGrade: 2, textRead: {},
};

// ═══ Progress Tracking ═══
function loadProgress() {
  try {
    const p = localStorage.getItem('houmu-progress');
    if (p) S.progress = JSON.parse(p);
  } catch(e) {}
  try {
    const t = localStorage.getItem('houmu-textread');
    if (t) S.textRead = JSON.parse(t);
  } catch(e) {}
}
function saveProgress() {
  try { localStorage.setItem('houmu-progress', JSON.stringify(S.progress)); } catch(e) {}
}
function toggleTextRead(key) {
  S.textRead[key] = !S.textRead[key];
  try { localStorage.setItem('houmu-textread', JSON.stringify(S.textRead)); } catch(e) {}
  render();
}
function getTextProgress(grade, ch) {
  var chapters = grade===1 ? (S.data.textbook&&S.data.textbook.grade1||[]) : (S.data.textbook&&S.data.textbook.grade2||[]);
  var chapter = chapters.find(function(c){ return c.ch === ch; });
  if (!chapter) return {done:0,total:0};
  var total = chapter.sections.length;
  var done = 0;
  chapter.sections.forEach(function(sec,i){ if(S.textRead[grade+'-'+ch+'-'+i]) done++; });
  return {done:done,total:total};
}
function recordResult(qId, correct, area) {
  if (!S.progress.g2[qId]) S.progress.g2[qId] = { correct: 0, wrong: 0, last: '', area: area };
  const rec = S.progress.g2[qId];
  if (correct) rec.correct++; else rec.wrong++;
  rec.last = new Date().toISOString().slice(0,10);
  rec.area = area;
  saveProgress();
}
function updateStreak() {
  const today = new Date().toISOString().slice(0,10);
  if (S.progress.lastDate === today) return;
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.progress.streak = (S.progress.lastDate === yesterday) ? S.progress.streak + 1 : 1;
  S.progress.lastDate = today;
  S.progress.totalSessions++;
  saveProgress();
}
function getAreaStats() {
  const stats = {};
  for (const [id, rec] of Object.entries(S.progress.g2)) {
    const a = rec.area || '不明';
    if (!stats[a]) stats[a] = { correct: 0, wrong: 0, total: 0 };
    stats[a].correct += rec.correct;
    stats[a].wrong += rec.wrong;
    stats[a].total += rec.correct + rec.wrong;
  }
  return stats;
}
function getWeakQuestions(pool) {
  // Spaced repetition: prioritize questions with wrong > correct, or never attempted
  const scored = pool.map(q => {
    const rec = S.progress.g2[q.id];
    if (!rec) return { q, priority: 2 }; // never attempted = high priority
    const ratio = rec.wrong / (rec.correct + rec.wrong + 0.01);
    return { q, priority: ratio > 0.5 ? 3 : ratio > 0 ? 1 : 0 };
  });
  scored.sort((a, b) => b.priority - a.priority);
  return scored.map(s => s.q);
}

// ═══ Data Loading ═══
// GitHub Pages対応: ベースパスを自動検出
const BASE = (function(){
  const p = location.pathname;
  return p.substring(0, p.lastIndexOf('/') + 1);
})();

var APP_VER = 'v61';
async function fetchJSON(path) {
  const url = BASE + path + '?v=' + APP_VER;
  const r = await fetch(url);
  if (!r.ok) throw new Error(path + ' が見つかりません (HTTP ' + r.status + ')。ファイルがデプロイされているか確認してください。');
  const ct = r.headers.get('content-type') || '';
  if (ct.includes('text/html')) throw new Error(path + ' がHTMLとして返されました。GitHub Pagesの場合、.nojekyll ファイルがリポジトリのルートにあるか確認してください。');
  return r.json();
}

async function loadData() {
  try {
    const [laws, g2, g1, tr, textbook, mock] = await Promise.all([
      fetchJSON('data/laws.json'),
      fetchJSON('data/grade2.json'),
      fetchJSON('data/grade1.json'),
      fetchJSON('data/training.json'),
      fetchJSON('data/textbook.json'),
      fetchJSON('data/mock.json'),
    ]);
    S.laws = laws;
    S.data = { g2, g1, tr, textbook, mock };
    try { S.apiKey = localStorage.getItem('gemini-key') || ''; } catch(e) {}
    try { S.apiKeyPro = localStorage.getItem('gemini-key-pro') || ''; } catch(e) {}
    try { S.geminiModel = localStorage.getItem('gemini-model') || 'gemini-3.1-flash-lite'; } catch(e) {}
    loadProgress();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="app"><div class="hdr"><h1>法務検定 学習</h1><p>ビジネス実務法務検定試験®</p></div><div class="info" style="color:var(--ng);border-color:var(--ng)"><b>⚠ データ読み込みエラー</b><br><br>'+e.message+'<br><br><b>確認事項:</b><br>1. リポジトリのルートに <code>.nojekyll</code> ファイルがあるか<br>2. <code>data/</code> フォルダと4つのJSONファイルがあるか<br>3. GitHub Pagesが有効になっているか（Settings → Pages）<br><br>ベースパス: <code>'+BASE+'</code></div></div>';
  }
}

// ═══ Helpers ═══
function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>'); }
function fmt(s) { return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function lawRefHTML(refs) {
  if (!refs || refs.length === 0) return '';
  const items = refs.map(r => ({ key: r, text: S.laws[r] })).filter(l => l.text);
  if (items.length === 0) return '';
  const id = 'law' + Math.random().toString(36).slice(2,8);
  return '<div class="lawref"><button class="lawbtn" onclick="document.getElementById(\''+id+'\').style.display=document.getElementById(\''+id+'\').style.display===\'none\'?\'block\':\'none\'">📜 参照条文 ('+items.length+'条)</button><div id="'+id+'" style="display:none" class="lawbox">'+items.map(l=>'<b>'+esc(l.key)+'</b><br>'+esc(l.text)).join('<br><br>')+'</div></div>';
}
function secLinkHTML(q) {
  if (!q.sec) return '';
  return '<button onclick="goToSection(\''+q.sec+'\')" style="margin-top:8px;padding:8px 14px;border-radius:var(--r);border:1.5px solid var(--bl);background:#fff;color:var(--bl);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;width:100%">📖 該当テキストを読む</button>';
}

// ═══ Timer ═══
function startTimer() { S.elapsed=0; S.running=true; S.timerId=setInterval(()=>{S.elapsed++;renderTimer();},1000); }
function stopTimer() { S.running=false; if(S.timerId){clearInterval(S.timerId);S.timerId=null;} }
function renderTimer() { const el=document.getElementById('timer'); if(el) el.textContent='⏱'+fmt(S.elapsed); }

// ═══ Navigation ═══
function go(view) { S.view=view; S._scrolled=false; render(); window.scrollTo(0,0); }
function goHome() { stopTimer(); go('home'); }
function goToSection(secId) {
  // secId = "g2-1-0" → grade2 ch1 sec0
  var parts = secId.split('-');
  var grade = parts[0]==='g1' ? 1 : 2;
  var ch = parseInt(parts[1]);
  var si = parseInt(parts[2]);
  // 戻り先を保存
  S._returnView = S.view;
  S._returnElapsed = S.elapsed;
  stopTimer();
  S.textGrade = grade;
  S.textCh = ch;
  S._scrollToSec = si;
  go('textch');
  setTimeout(function(){ var el=document.getElementById('sec-'+si); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 100);
}
function returnFromText() {
  if (S._returnView) {
    S.view = S._returnView;
    S.elapsed = S._returnElapsed || 0;
    S._returnView = null;
    startTimer();
    render();
  } else {
    go('textbook');
  }
}

// ═══ Gemini API ═══
async function callGemini(scenario, subQs, essays, model, useProModel) {
  var modelId = useProModel ? 'gemini-3.1-pro-preview' : S.geminiModel;
  var key = useProModel && S.apiKeyPro ? S.apiKeyPro : S.apiKey;
  const prompt = "あなたはビジネス実務法務検定1級の採点官です。JSON形式のみで出力。{\"totalScore\":<0-50>,\"breakdown\":{\"legalBasis\":<0-15>,\"application\":<0-15>,\"logic\":<0-10>,\"conclusion\":<0-10>},\"subEvals\":[{\"subQ\":<番号>,\"score\":<点>,\"strengths\":\"良い点\",\"weaknesses\":\"改善点\",\"missingPoints\":\"漏れ論点\"}],\"overallComment\":\"総合講評\",\"passLevel\":\"<A|B|C|D>\"}\n\n【事例】\n"+scenario+"\n\n【設問と解答】\n"+subQs.map((sq,i)=>sq+"\n"+(essays[i]||"（未回答）")).join("\n\n")+"\n\n【模範解答】\n"+model+"\n\nJSON:";
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+modelId+':generateContent?key='+key, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,maxOutputTokens:4096}})
  });
  if (!r.ok) throw new Error('API '+r.status);
  const d = await r.json();
  const t = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return JSON.parse(t.replace(/```json\n?/g,'').replace(/```/g,'').trim());
}

// ═══ Quiz Actions ═══
function start2(mode) {
  updateStreak();
  let pool;
  if (mode === 'weak') {
    pool = getWeakQuestions([...S.data.g2]).slice(0, 20);
  } else if (mode === 'all') {
    pool = shuffle([...S.data.g2]);
  } else {
    pool = shuffle([...S.data.g2]).slice(0, 15);
  }
  Object.assign(S, {qs:pool,ci:0,sel:null,answered:false,score:0,hist:[],revI:null,quizMode:mode});
  startTimer(); go('quiz2');
}

function startMock(mockId) {
  updateStreak();
  var exam = (S.data.mock||[]).find(function(m){ return m.id === mockId; });
  if (!exam) return;
  var pool = [...exam.questions];
  Object.assign(S, {qs:pool,ci:0,sel:null,answered:false,score:0,hist:[],revI:null,quizMode:'mock',mockTitle:exam.title});
  startTimer(); go('quiz2');
}

function confirm2() {
  if (S.sel===null) return;
  const ok = S.sel===S.qs[S.ci].ans;
  if (ok) S.score++;
  S.hist.push({sel:S.sel,ok});
  if(S.qs[S.ci].id) recordResult(S.qs[S.ci].id, ok, S.qs[S.ci].a);
  if (S.quizMode==='mock') {
    // 模試モード: 解説を表示せず次の問題へ自動進行
    if (S.ci+1>=S.qs.length) { stopTimer(); go('res2'); }
    else { S.ci++; S.sel=null; render(); window.scrollTo(0,0); }
  } else {
    S.answered=true; render();
  }
}

function next2() {
  if (S.ci+1>=S.qs.length) { stopTimer(); go('res2'); }
  else { S.ci++; S.sel=null; S.answered=false; render(); window.scrollTo(0,0); }
}

// セクション練習: textbook.jsonに埋め込まれた専用問題を出題
function startSectionQuiz(grade, ch, secIdx) {
  updateStreak();
  var chapters = grade===1 ? (S.data.textbook&&S.data.textbook.grade1||[]) : (S.data.textbook&&S.data.textbook.grade2||[]);
  var chapter = chapters.find(function(c){ return c.ch === ch; });
  if (!chapter || !chapter.sections[secIdx]) return;
  var sec = chapter.sections[secIdx];
  if (!sec.quiz || sec.quiz.length === 0) { alert('この章の練習問題はまだありません'); return; }
  var trQs = sec.quiz.map(function(q) { return {t:'tf', q:q.q, ans:q.ans, ex:q.ex, laws:q.laws||[]}; });
  Object.assign(S, {trQs:trQs,trCi:0,trSel:[],trDone:false,trScore:0,trHist:[],trAns:''});
  go('train');
}

function start1(mode) {
  let pool;
  if (mode==='common') pool = S.data.g1.common;
  else if (mode==='full') pool = [...S.data.g1.common,...S.data.g1.selection.slice(0,2)];
  else pool = S.data.g1.selection;
  Object.assign(S, {g1qs:pool,g1ci:0,essay:['','',''],showMdl:false,gradeRes:null,g1hist:[]});
  startTimer(); go('quiz1');
}

function next1() {
  S.g1hist.push({essay:[...S.essay],grade:S.gradeRes});
  S.gradeRes=null; S.showMdl=false;
  if (S.g1ci+1>=S.g1qs.length) { stopTimer(); go('res1'); }
  else { S.g1ci++; S.essay=['','','']; render(); window.scrollTo(0,0); }
}

async function doGrade(useProModel) {
  if (!S.apiKey && !S.apiKeyPro) { alert('設定からGemini APIキーを登録してください'); return; }
  S.grading=true; render();
  try {
    const q=S.g1qs[S.g1ci];
    S.gradeRes = await callGemini(q.scenario,q.subQs,S.essay,q.modelAns,useProModel);
    S.gradeRes._model = useProModel ? 'gemini-3.1-pro-preview' : S.geminiModel;
  } catch(e) { S.gradeRes={error:e.message}; }
  S.grading=false; render();
}

// Training
function startTr(bank, type) {
  let pool; if(type==='all') pool=shuffle([...bank]); else pool=shuffle(bank.filter(q=>q.t===type));
  Object.assign(S, {trQs:pool.slice(0,Math.min(pool.length,10)),trCi:0,trSel:[],trDone:false,trScore:0,trHist:[],trAns:''});
  go('train');
}

function trToggle(i) { if(S.trDone)return; const idx=S.trSel.indexOf(i); if(idx>=0)S.trSel.splice(idx,1);else S.trSel.push(i); render(); }

function trConfirm() {
  const q=S.trQs[S.trCi];
  if(q.t==='short'){S.trDone=true;S.trHist.push({ans:S.trAns});render();return;}
  if(q.t==='tf'){const ok=S.trSel[0]===(q.ans?0:1);if(ok)S.trScore++;S.trHist.push({sel:[...S.trSel],correct:ok});S.trDone=true;S.progress.totalAnswered=(S.progress.totalAnswered||0)+1;if(ok)S.progress.totalCorrect=(S.progress.totalCorrect||0)+1;saveProgress();render();return;}
  const ok=q.t==='article'?S.trSel.length===1&&S.trSel[0]===q.ans:Array.isArray(q.ans)&&q.ans.length===S.trSel.length&&q.ans.every(a=>S.trSel.includes(a));
  if(ok)S.trScore++;S.trHist.push({sel:[...S.trSel],correct:ok});S.trDone=true;S.progress.totalAnswered=(S.progress.totalAnswered||0)+1;if(ok)S.progress.totalCorrect=(S.progress.totalCorrect||0)+1;saveProgress();render();
}

function trNext() {
  if(S.trCi+1>=S.trQs.length){go('trRes');}
  else{S.trCi++;S.trSel=[];S.trDone=false;S.trAns='';render();window.scrollTo(0,0);}
}

      h += '<div class="grd"><div class="ml2" style="color:var(--bl)">🤖 AI添削結果 <span style="font-size:13px;font-weight:400;color:var(--ink2)">('+(g._model||S.geminiModel)+')</span></div>';
      h += '<div class="gs"><span class="gsc">'+g.totalScore+'</span><span class="gsu">/50点</span>';
      h += '<span class="glv glv-'+g.passLevel+'">'+({A:'合格水準',B:'あと一歩',C:'基礎力不足',D:'要学習'}[g.passLevel]||'')+'</span></div>';
      if(g.breakdown)h+='<div class="gbd"><div>法的根拠:'+g.breakdown.legalBasis+'/15</div><div>あてはめ:'+g.breakdown.application+'/15</div><div>論理構成:'+g.breakdown.logic+'/10</div><div>結論:'+g.breakdown.conclusion+'/10</div></div>';
      (g.subEvals||[]).forEach(se=>{h+='<div class="gse"><div style="font-weight:700">小問'+se.subQ+'('+se.score+'点)</div>';if(se.strengths)h+='<div>👍 '+esc(se.strengths)+'</div>';if(se.weaknesses)h+='<div style="color:var(--ng)">⚠ '+esc(se.weaknesses)+'</div>';if(se.missingPoints)h+='<div style="color:var(--gd)">📋 '+esc(se.missingPoints)+'</div>';h+='</div>';});
      if(g.overallComment)h+='<div style="margin-top:10px;padding:10px;background:#f8f6f0;border-radius:6px;font-size:15px;line-height:1.8"><b>総合講評:</b> '+esc(g.overallComment)+'</div>';
      h+='</div>';
    }
    if(S.gradeRes?.error)h+='<div class="exp eng"><div class="el">APIエラー</div><div>'+esc(S.gradeRes.error)+'</div></div>';

  } else if (S.view==='res2') {
    const pct=S.qs.length?Math.round(S.score/S.qs.length*100):0;
    const isExam = S.quizMode==='mock';
    const points = Math.round(S.score*2.5);
    const totalPoints = Math.round(S.qs.length*2.5);
    const passed = isExam ? points >= 70 : pct >= 70;
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › '+(isExam ? S.mockTitle||'模擬試験' : '2級')+'結果</div>';
    if (isExam) {
      h += '<div class="rc" style="border-color:'+(passed?'var(--ok)':'var(--ng)') +'">';
      h += '<div style="font-size:15px;font-weight:700;color:'+(passed?'var(--ok)':'var(--ng)')+';margin-bottom:6px">'+(passed?'🎉 合格':'不合格')+'</div>';
      h += '<div class="rs">'+points+'<span>/100点</span></div>';
      h += '<div class="rl">正解'+S.score+'/'+S.qs.length+'問（各2.5点）</div>';
      h += '<div class="rp '+(passed?'rph':'rpl')+'">合格ライン: 70点'+(passed?' ✓ 到達':' ✗ 未到達')+'</div>';
      h += '<div class="rm">所要時間: '+fmt(S.elapsed)+' / 制限: 90分'+(S.elapsed>5400?' ⚠ 超過':'')+'</div>';
      h += '</div>';
    } else {
      h += '<div class="rc"><div class="rs">'+S.score+'<span>/'+S.qs.length+'</span></div>';
      h += '<div class="rl">'+points+'点/'+totalPoints+'点</div>';
      h += '<div class="rp '+(pct>=70?'rph':pct>=40?'rpm':'rpl')+'">'+pct+'%'+(pct>=70?' 合格ライン相当':'')+'</div>';
      h += '<div class="rm">所要時間: '+fmt(S.elapsed)+'</div></div>';
    }
    h += '<div class="stitle">解答一覧（タップで解説＋条文参照）</div>';
    h += '<div class="rvl">';
    S.qs.forEach((q,i)=>{h+='<div class="rvi" onclick="S.revI=S.revI==='+i+'?null:'+i+';render();"><span class="rvd '+(S.hist[i]?.ok?'ok':'ng')+'"></span><span class="rvt">問'+(i+1)+' ['+q.a+'] '+esc(q.q.substring(0,30))+'…</span><span style="color:#999">'+(S.revI===i?'▲':'▼')+'</span></div>';});
    h += '</div>';
    if(S.revI!==null){const q=S.qs[S.revI];h+='<div class="rvp"><div class="qt">'+esc(q.q)+'</div>';if(q.t==='combo'){h+='<div class="stmts">';q.s.forEach(s=>h+='<div class="stm">'+esc(s)+'</div>');h+='</div>';}h+='<div class="exp '+(S.hist[S.revI]?.ok?'eok':'eng')+'"><div class="el">'+(S.hist[S.revI]?.ok?'⭕':'❌')+'</div><div>'+esc(q.ex)+'</div>'+lawRefHTML(q.laws)+secLinkHTML(q)+'</div></div>';}
    h += '<div class="ctr"><button class="btn bo" onclick="goHome()">ホーム</button><button class="btn bp" onclick="start2(S.qs.length>15?\'full\':\'practice\')">再挑戦</button></div>';

  } else if (S.view==='res1') {
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › 1級完了</div>';
    h += '<div class="rc"><div style="font-family:\'Noto Serif JP\',serif;font-size:20px;font-weight:700">論述演習完了</div><div class="rl">'+S.g1qs.length+'問 | '+fmt(S.elapsed)+'</div></div>';
    S.g1qs.forEach((q,i)=>{
      h+='<div class="rvp" style="margin-bottom:14px"><div style="font-weight:700;margin-bottom:6px">'+esc(q.title)+'</div>';
      q.subQs.forEach((sq,j)=>{h+='<div class="sq" style="font-size:16px">'+esc(sq)+'</div><div style="padding:7px;background:#f0f4f8;border-radius:6px;font-size:16px;line-height:1.7;margin-bottom:5px;white-space:pre-wrap">'+esc(S.g1hist[i]?.essay?.[j]||'（未回答）')+'</div>';});
      if(S.g1hist[i]?.grade&&!S.g1hist[i].grade.error)h+='<div style="padding:7px;background:#e8f0fe;border-radius:6px;font-size:16px;margin-bottom:6px">AI: <b>'+S.g1hist[i].grade.totalScore+'/50点</b> ['+S.g1hist[i].grade.passLevel+']</div>';
      h+='<details><summary style="cursor:pointer;font-size:16px;color:var(--bl)">模範解答</summary><div class="mdl" style="margin-top:6px">'+esc(q.modelAns)+'</div></details></div>';
    });
    h += '<div class="ctr"><button class="btn bo" onclick="goHome()">ホーム</button></div>';
  }

  app.innerHTML = h;
  // テキスト章表示時: 未学習の最初のセクションに自動スクロール
  if (S.view === 'textch' && !S._scrolled) {
    S._scrolled = true;
    setTimeout(function() {
      var chapters = S.textGrade===1 ? (S.data.textbook&&S.data.textbook.grade1||[]) : (S.data.textbook&&S.data.textbook.grade2||[]);
      var chapter = chapters.find(function(c){ return c.ch === S.textCh; });
      if (chapter) {
        for (var i = 0; i < chapter.sections.length; i++) {
          if (!S.textRead[S.textGrade+'-'+S.textCh+'-'+i]) {
            var el = document.getElementById('sec-'+i);
            if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
            break;
          }
        }
      }
    }, 100);
  }
}

// ═══ PWA & Offline ═══
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW error:', e));
}
window.addEventListener('online', () => { document.body.classList.remove('offline'); });
window.addEventListener('offline', () => { document.body.classList.add('offline'); });
if (!navigator.onLine) document.body.classList.add('offline');

// ═══ Boot ═══
loadData();
</script>
</body>
</html>
