<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>法務検定 学習</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161a;--ink2:#4a4a5a;--bg:#f7f4ee;--bg2:#ece6d8;--bl:#1a3a5c;--bl2:#2d6a9f;--gd:#9e7c0c;--ok:#1b6b3a;--ok2:#d4edda;--ng:#8b1a1a;--ng2:#f8d7da;--or:#c26a00;--or2:#fff3cd;--r:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:780px;margin:0 auto;padding:16px 14px 90px}
.hdr{text-align:center;padding:22px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:22px;position:relative}
.hdr::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:60px;height:2px;background:var(--gd)}
.hdr h1{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:900;letter-spacing:5px}
.hdr p{font-size:11px;color:var(--ink2);letter-spacing:2px;margin-top:2px}
.bc{display:flex;align-items:center;gap:5px;margin-bottom:14px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.bc a{color:var(--bl2);cursor:pointer;text-decoration:underline}
.tg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;margin:0 2px}
.tg-b{background:#e8f0fe;color:var(--bl)}.tg-r{background:var(--ng2);color:var(--ng)}.tg-y{background:#fef3cd;color:#856404}.tg-g{background:var(--ok2);color:var(--ok)}.tg-o{background:var(--or2);color:var(--or)}
.info{padding:11px;background:#fff;border:1px solid var(--bg2);border-radius:var(--r);margin-bottom:14px;font-size:12px;line-height:1.8;color:var(--ink2)}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:10px}
.card{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:20px 10px;text-align:center;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}
.card h2{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:900;margin-bottom:3px}
.card.c2 h2{color:var(--bl)}.card.c1 h2{color:var(--ng)}.card.ct h2{color:var(--or);font-size:22px}
.card p{font-size:11px;color:var(--ink2)}.card .cnt{font-size:10px;color:var(--ink2);margin-top:3px}
.ml{display:flex;flex-direction:column;gap:7px}
.cb{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1.5px solid var(--bg2);border-radius:var(--r);padding:11px 13px;cursor:pointer;font-size:13px;color:var(--ink);text-align:left;width:100%;font-family:inherit;transition:.15s}
.cb:hover{border-color:var(--ink)}.cb .n{font-size:11px;color:var(--ink2);white-space:nowrap;margin-left:8px}
.cb.all{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}.cb.all .n{color:rgba(255,255,255,.6)}
.cb.or{background:var(--or);color:#fff;border-color:var(--or);font-weight:600}
.pbar{width:100%;height:4px;background:var(--bg2);border-radius:3px;margin-bottom:12px;overflow:hidden}
.pfill{height:100%;border-radius:3px;transition:width .4s}
.pf2{background:var(--bl)}.pf1{background:var(--ng)}.pft{background:var(--or)}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.qn{font-family:'Noto Serif JP',serif;font-size:12px;font-weight:700;color:var(--ink2)}
.qs{font-size:11px;color:var(--gd);font-weight:600}
.tmr{margin-left:auto;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qt{font-size:13px;line-height:1.9;margin-bottom:14px;padding:13px;background:#fff;border-left:3px solid var(--gd);border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap}
.stmts{margin-bottom:12px;padding:9px 13px;background:#fff;border-radius:var(--r);border:1px solid var(--bg2)}
.stm{font-size:12px;line-height:1.8;padding:4px 0;border-bottom:1px dashed var(--bg2)}.stm:last-child{border-bottom:none}
.chs{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ch{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;background:#fff;border:1.5px solid var(--bg2);border-radius:var(--r);cursor:pointer;font-size:12px;line-height:1.7;color:var(--ink);text-align:left;font-family:inherit;width:100%;transition:.15s}
.ch:hover:not(.lk){border-color:var(--bl2);background:#f0f4f8}
.ch.sel{border-color:var(--bl);background:#e8f0fe}.ch.ok{border-color:var(--ok);background:var(--ok2)}.ch.ng{border-color:var(--ng);background:var(--ng2)}
.mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--bg2);background:var(--bg);color:var(--ink2);margin-top:1px}
.ch.sel .mk{border-color:var(--bl);background:var(--bl);color:#fff}.ch.ok .mk{border-color:var(--ok);background:var(--ok);color:#fff}.ch.ng .mk{border-color:var(--ng);background:var(--ng);color:#fff}
.exp{padding:12px;border-radius:var(--r);margin-bottom:12px;font-size:12px;line-height:1.9;animation:fi .3s}
.eok{background:var(--ok2);border:1px solid var(--ok)}.eng{background:var(--ng2);border:1px solid var(--ng)}
.el{font-weight:700;margin-bottom:3px;font-size:13px}.eok .el{color:var(--ok)}.eng .el{color:var(--ng)}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.br{display:flex;gap:7px;justify-content:flex-end;margin-top:8px}
.btn{padding:8px 18px;border:none;border-radius:var(--r);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.bp{background:var(--ink);color:#fff}.bp:hover{opacity:.85}.bp:disabled{background:var(--bg2);color:#aaa;cursor:not-allowed}
.bo{background:#fff;border:1.5px solid var(--ink);color:var(--ink)}.bo:hover{background:var(--bg)}
.bg{background:var(--bl);color:#fff}.bor{background:var(--or);color:#fff}
.rc{text-align:center;padding:28px 12px;background:#fff;border:2px solid var(--ink);border-radius:var(--r);margin-bottom:14px}
.rs{font-family:'Noto Serif JP',serif;font-size:44px;font-weight:900;line-height:1}.rs span{font-size:18px;color:var(--ink2)}
.rl{margin-top:5px;font-size:12px;color:var(--ink2)}.rm{margin-top:6px;font-size:12px;color:var(--ink2)}
.rp{margin-top:3px;font-size:15px;font-weight:700}.rph{color:var(--ok)}.rpm{color:var(--gd)}.rpl{color:var(--ng)}
.stitle{font-family:'Noto Serif JP',serif;font-size:14px;font-weight:700;margin-bottom:10px}
.ctr{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.rvl{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.rvi{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#fff;border-radius:var(--r);border:1px solid var(--bg2);cursor:pointer;font-size:12px}
.rvi:hover{border-color:var(--ink2)}.rvd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rvd.ok{background:var(--ok)}.rvd.ng{background:var(--ng)}
.rvt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvp{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;margin-bottom:14px;animation:fi .3s}
.sq{font-size:13px;line-height:1.8;font-weight:600;margin:12px 0 5px}
.ta{width:100%;min-height:110px;padding:9px;border:1.5px solid var(--bg2);border-radius:var(--r);font-family:inherit;font-size:12px;line-height:1.8;resize:vertical;background:#fff;color:var(--ink)}.ta:focus{outline:none;border-color:var(--bl)}.ta-sm{min-height:65px}
.mdl{padding:12px;background:#fdf6e3;border:1px solid var(--gd);border-radius:var(--r);margin-top:12px;font-size:12px;line-height:1.9;white-space:pre-wrap}
.ml2{font-family:'Noto Serif JP',serif;font-weight:700;color:var(--gd);margin-bottom:5px;font-size:13px}
.inp{width:100%;padding:9px;border:1.5px solid var(--bg2);border-radius:var(--r);font-family:inherit;font-size:13px;background:#fff}.inp:focus{outline:none;border-color:var(--bl)}
.grd{padding:14px;background:#fff;border:2px solid var(--bl);border-radius:var(--r);margin-top:12px;font-size:12px;line-height:1.8;animation:fi .3s}
.gs{display:flex;align-items:baseline;gap:5px;margin-bottom:8px}
.gsc{font-family:'Noto Serif JP',serif;font-size:32px;font-weight:900;color:var(--bl)}.gsu{font-size:13px;color:var(--ink2)}
.glv{padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700}
.glv-A{background:var(--ok2);color:var(--ok)}.glv-B{background:#fef3cd;color:#856404}.glv-C{background:var(--ng2);color:var(--ng)}.glv-D{background:#f5c6cb;color:#721c24}
.gbd{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:10px;padding:7px;background:#f8f6f0;border-radius:6px;font-size:11px}
.gse{padding:8px;border:1px solid var(--bg2);border-radius:6px;margin-bottom:6px;font-size:12px;line-height:1.7}
.advice{padding:14px;background:#fff;border:2px solid var(--or);border-radius:var(--r);margin-bottom:14px;font-size:12px;line-height:1.9}
.advice h3{font-family:'Noto Serif JP',serif;font-size:13px;color:var(--or);margin-bottom:6px}
.lawref{margin-top:7px}.lawbtn{background:none;border:1px solid var(--gd);border-radius:4px;padding:2px 9px;font-size:11px;color:var(--gd);cursor:pointer;font-family:inherit;font-weight:600}
.lawbox{margin-top:5px;padding:9px;background:#fffbf0;border:1px solid var(--gd);border-radius:6px;font-size:11px;line-height:1.8}
.lawbox b{color:var(--gd)}.sbtn{display:block;margin:14px auto 0;background:none;border:1px solid var(--bg2);border-radius:var(--r);padding:7px 18px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit}
.sbtn:hover{border-color:var(--ink)}
.offline-badge{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:4px 14px;border-radius:20px;font-size:11px;z-index:99;display:none}
body.offline .offline-badge{display:block}
</style>
</head>
<body>
<div class="offline-badge">📴 オフラインモード</div>
<div id="app" class="app">
  <div class="hdr"><h1>法務検定 学習</h1><p>ビジネス実務法務検定試験® 学習＆演習</p></div>
  <div style="text-align:center;padding:40px;color:var(--ink2)">読み込み中...</div>
</div>

<script>
// ═══ App State ═══
const S = {
  view: 'home', data: {}, laws: {},
  apiKey: '', keyInput: '',
  // quiz
  qs: [], ci: 0, sel: null, answered: false, score: 0, hist: [], revI: null,
  // grade1
  g1qs: [], g1ci: 0, essay: ['','',''], showMdl: false, g1hist: [], grading: false, gradeRes: null,
  // training
  trQs: [], trCi: 0, trSel: [], trDone: false, trScore: 0, trHist: [], trAns: '',
  // timer
  elapsed: 0, running: false, timerId: null,
};

// ═══ Data Loading ═══
async function loadData() {
  try {
    const [laws, g2, g1, tr] = await Promise.all([
      fetch('data/laws.json').then(r => r.json()),
      fetch('data/grade2.json').then(r => r.json()),
      fetch('data/grade1.json').then(r => r.json()),
      fetch('data/training.json').then(r => r.json()),
    ]);
    S.laws = laws;
    S.data = { g2, g1, tr };
    // Load API key
    try { S.apiKey = localStorage.getItem('gemini-key') || ''; } catch(e) {}
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="app"><div class="info" style="color:var(--ng)">データの読み込みに失敗しました。<br>index.htmlと同じディレクトリにdata/フォルダがあるか確認してください。<br><br>エラー: '+e.message+'</div></div>';
  }
}

// ═══ Helpers ═══
function shuffle(a) { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>'); }
function fmt(s) { return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function lawRefHTML(refs) {
  if (!refs || refs.length === 0) return '';
  const items = refs.map(r => ({ key: r, text: S.laws[r] })).filter(l => l.text);
  if (items.length === 0) return '';
  const id = 'law' + Math.random().toString(36).slice(2,8);
  return '<div class="lawref"><button class="lawbtn" onclick="document.getElementById(\''+id+'\').style.display=document.getElementById(\''+id+'\').style.display===\'none\'?\'block\':\'none\'">📜 参照条文 ('+items.length+'条)</button><div id="'+id+'" style="display:none" class="lawbox">'+items.map(l=>'<b>'+esc(l.key)+'</b><br>'+esc(l.text)).join('<br><br>')+'</div></div>';
}

// ═══ Timer ═══
function startTimer() { S.elapsed=0; S.running=true; S.timerId=setInterval(()=>{S.elapsed++;renderTimer();},1000); }
function stopTimer() { S.running=false; if(S.timerId){clearInterval(S.timerId);S.timerId=null;} }
function renderTimer() { const el=document.getElementById('timer'); if(el) el.textContent='⏱'+fmt(S.elapsed); }

// ═══ Navigation ═══
function go(view) { S.view=view; render(); window.scrollTo(0,0); }
function goHome() { stopTimer(); go('home'); }

// ═══ Gemini API ═══
async function callGemini(scenario, subQs, essays, model) {
  const prompt = "あなたはビジネス実務法務検定1級の採点官です。JSON形式のみで出力。{\"totalScore\":<0-50>,\"breakdown\":{\"legalBasis\":<0-15>,\"application\":<0-15>,\"logic\":<0-10>,\"conclusion\":<0-10>},\"subEvals\":[{\"subQ\":<番号>,\"score\":<点>,\"strengths\":\"良い点\",\"weaknesses\":\"改善点\",\"missingPoints\":\"漏れ論点\"}],\"overallComment\":\"総合講評\",\"passLevel\":\"<A|B|C|D>\"}\n\n【事例】\n"+scenario+"\n\n【設問と解答】\n"+subQs.map((sq,i)=>sq+"\n"+(essays[i]||"（未回答）")).join("\n\n")+"\n\n【模範解答】\n"+model+"\n\nJSON:";
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+S.apiKey, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,maxOutputTokens:4096}})
  });
  if (!r.ok) throw new Error('API '+r.status);
  const d = await r.json();
  const t = d.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return JSON.parse(t.replace(/```json\n?/g,'').replace(/```/g,'').trim());
}

// ═══ Quiz Actions ═══
function start2(mode) {
  const pool = mode==='full' ? shuffle([...S.data.g2]) : shuffle([...S.data.g2]).slice(0,15);
  Object.assign(S, {qs:pool,ci:0,sel:null,answered:false,score:0,hist:[],revI:null});
  startTimer(); go('quiz2');
}

function confirm2() {
  if (S.sel===null) return;
  const ok = S.sel===S.qs[S.ci].ans;
  if (ok) S.score++;
  S.hist.push({sel:S.sel,ok});
  S.answered=true; render();
}

function next2() {
  if (S.ci+1>=S.qs.length) { stopTimer(); go('res2'); }
  else { S.ci++; S.sel=null; S.answered=false; render(); window.scrollTo(0,0); }
}

function start1(mode) {
  let pool;
  if (mode==='common') pool = S.data.g1.common;
  else if (mode==='full') pool = [...S.data.g1.common,...S.data.g1.selection.slice(0,2)];
  else pool = S.data.g1.selection;
  Object.assign(S, {g1qs:pool,g1ci:0,essay:['','',''],showMdl:false,gradeRes:null,g1hist:[]});
  startTimer(); go('quiz1');
}

function next1() {
  S.g1hist.push({essay:[...S.essay],grade:S.gradeRes});
  S.gradeRes=null; S.showMdl=false;
  if (S.g1ci+1>=S.g1qs.length) { stopTimer(); go('res1'); }
  else { S.g1ci++; S.essay=['','','']; render(); window.scrollTo(0,0); }
}

async function doGrade() {
  if (!S.apiKey) { alert('設定からGemini APIキーを登録してください'); return; }
  S.grading=true; render();
  try {
    const q=S.g1qs[S.g1ci];
    S.gradeRes = await callGemini(q.scenario,q.subQs,S.essay,q.modelAns);
  } catch(e) { S.gradeRes={error:e.message}; }
  S.grading=false; render();
}

// Training
function startTr(bank, type) {
  let pool; if(type==='all') pool=shuffle([...bank]); else pool=shuffle(bank.filter(q=>q.t===type));
  Object.assign(S, {trQs:pool.slice(0,Math.min(pool.length,10)),trCi:0,trSel:[],trDone:false,trScore:0,trHist:[],trAns:''});
  go('train');
}

function trToggle(i) { if(S.trDone)return; const idx=S.trSel.indexOf(i); if(idx>=0)S.trSel.splice(idx,1);else S.trSel.push(i); render(); }

function trConfirm() {
  const q=S.trQs[S.trCi];
  if(q.t==='short'){S.trDone=true;S.trHist.push({ans:S.trAns});render();return;}
  if(q.t==='tf'){const ok=S.trSel[0]===(q.ans?0:1);if(ok)S.trScore++;S.trHist.push({sel:[...S.trSel],correct:ok});S.trDone=true;render();return;}
  const ok=q.t==='article'?S.trSel.length===1&&S.trSel[0]===q.ans:Array.isArray(q.ans)&&q.ans.length===S.trSel.length&&q.ans.every(a=>S.trSel.includes(a));
  if(ok)S.trScore++;S.trHist.push({sel:[...S.trSel],correct:ok});S.trDone=true;render();
}

function trNext() {
  if(S.trCi+1>=S.trQs.length){go('trRes');}
  else{S.trCi++;S.trSel=[];S.trDone=false;S.trAns='';render();window.scrollTo(0,0);}
}

// ═══ Render ═══
function render() {
  const app = document.getElementById('app');
  let h = '<div class="hdr"><h1>法務検定 学習</h1><p>ビジネス実務法務検定試験® 学習＆演習</p></div>';

  if (S.view==='home') {
    const g2n=S.data.g2?.length||0, g1n=(S.data.g1?.common?.length||0)+(S.data.g1?.selection?.length||0);
    const trn=(S.data.tr?.grade2?.length||0)+(S.data.tr?.grade1?.length||0);
    h += '<div class="info"><b>学習→トレーニング→演習</b>の3ステップで合格力を積み上げます。<br>';
    h += '<span class="tg tg-b">2級</span>多肢選択 <span class="tg tg-r">1級</span>論述 <span class="tg tg-o">練習</span>パーツ練習<br>';
    h += S.apiKey ? '<span style="color:var(--ok)">✓ Gemini API登録済</span>' : '<span style="color:var(--ng)">⚠ APIキー未登録 → <a onclick="go(\'settings\')">設定</a></span>';
    h += '</div>';
    h += '<div class="cards">';
    h += '<div class="card c2" onclick="go(\'g2menu\')"><h2>2級</h2><p>演習＆練習</p><div class="cnt">'+g2n+'問</div></div>';
    h += '<div class="card c1" onclick="go(\'g1menu\')"><h2>1級</h2><p>演習＆練習</p><div class="cnt">'+g1n+'問</div></div>';
    h += '<div class="card ct" onclick="go(\'trMenu\')"><h2>練習</h2><p>パーツ練習</p><div class="cnt">'+trn+'問</div></div>';
    h += '</div>';
    h += '<button class="sbtn" onclick="go(\'settings\')">⚙ 設定（APIキー）</button>';

  } else if (S.view==='settings') {
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › 設定</div>';
    h += '<div class="stitle">Gemini APIキー</div>';
    h += '<div class="info">1級AI添削に必要。<a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--bl)">Google AI Studio</a>で無料取得可。</div>';
    h += '<input class="inp" type="password" id="keyinp" placeholder="APIキー" value="'+esc(S.apiKey)+'">';
    h += '<div style="display:flex;gap:7px;margin-top:7px"><button class="btn bp" onclick="const v=document.getElementById(\'keyinp\').value.trim();if(v){S.apiKey=v;try{localStorage.setItem(\'gemini-key\',v)}catch(e){}goHome();}">保存</button><button class="btn bo" onclick="goHome()">戻る</button></div>';
    if (S.apiKey) h += '<div style="margin-top:10px;font-size:12px;color:var(--ok)">✓ 登録済: '+S.apiKey.substring(0,8)+'...</div>';

  } else if (S.view==='g2menu') {
    const tr2=S.data.tr?.grade2||[];
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › <span class="tg tg-b">2級</span></div>';
    h += '<div class="stitle">2級 — 学習メニュー</div>';
    h += '<div class="advice"><h3>📚 2級の学習ポイント</h3>民法・商法・会社法が約50%。条文の正確な理解が合否を分けます。<br>まず「トレーニング」で基礎固め→「演習」で本試験形式に挑戦。<br>解説の<b>「📜参照条文」</b>で条文原文を必ず確認。</div>';
    h += '<div class="ml">';
    h += '<button class="cb or" onclick="startTr(S.data.tr.grade2,\'all\')"><span>🏋️ 2級トレーニング</span><span class="n">'+tr2.length+'問</span></button>';
    h += '<button class="cb all" onclick="start2(\'full\')"><span>本試験モード（全問）</span><span class="n">タイマー付</span></button>';
    h += '<button class="cb" onclick="start2(\'practice\')"><span>練習モード（15問）</span><span class="n">ランダム</span></button>';
    h += '</div>';

  } else if (S.view==='g1menu') {
    const tr1=S.data.tr?.grade1||[];
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › <span class="tg tg-r">1級</span></div>';
    h += '<div class="stitle">1級 — 学習メニュー</div>';
    h += '<div class="advice"><h3>📚 1級の学習ステップ</h3><b>①毎日5分</b>: 論点発見・条文番号・要件チェック<br><b>②毎日10分</b>: 短文論述<br><b>③週末90分</b>: 本番演習＋AI添削</div>';
    h += '<div class="ml">';
    h += '<button class="cb or" onclick="startTr(S.data.tr.grade1,\'all\')"><span>🏋️ 1級トレーニング</span><span class="n">'+tr1.length+'問</span></button>';
    h += '<button class="cb all" onclick="start1(\'common\')"><span>共通問題（民法+会社法）</span><span class="n">2問</span></button>';
    h += '<button class="cb" onclick="start1(\'select\')"><span>選択問題</span><span class="n">4問</span></button>';
    h += '<button class="cb" onclick="start1(\'full\')"><span>本試験モード</span><span class="n">4問</span></button>';
    h += '</div>';

  } else if (S.view==='trMenu') {
    const tr2=S.data.tr?.grade2||[], tr1=S.data.tr?.grade1||[], all=[...tr2,...tr1];
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › <span class="tg tg-o">練習</span></div>';
    h += '<div class="stitle">パーツ練習</div>';
    h += '<div class="advice"><h3>🎯 スキマ時間で基礎力UP</h3>解説では<b>参照条文の原文</b>も確認できます。</div>';
    h += '<div class="ml">';
    h += '<button class="cb all" onclick="startTr([...S.data.tr.grade2,...S.data.tr.grade1],\'all\')"><span>全問ミックス</span><span class="n">'+all.length+'問</span></button>';
    h += '<button class="cb" onclick="startTr(S.data.tr.grade2,\'tf\')"><span>2級 正誤判断</span><span class="n">'+tr2.filter(q=>q.t==='tf').length+'問</span></button>';
    h += '<button class="cb" onclick="startTr([...S.data.tr.grade2,...S.data.tr.grade1],\'article\')"><span>条文番号クイズ</span><span class="n">'+all.filter(q=>q.t==='article').length+'問</span></button>';
    h += '<button class="cb" onclick="startTr(S.data.tr.grade1,\'issue\')"><span>1級 論点発見</span><span class="n">'+tr1.filter(q=>q.t==='issue').length+'問</span></button>';
    h += '<button class="cb" onclick="startTr(S.data.tr.grade1,\'require\')"><span>1級 要件チェック</span><span class="n">'+tr1.filter(q=>q.t==='require').length+'問</span></button>';
    h += '<button class="cb" onclick="startTr(S.data.tr.grade1,\'short\')"><span>1級 短文論述</span><span class="n">'+tr1.filter(q=>q.t==='short').length+'問</span></button>';
    h += '</div>';

  } else if (S.view==='train' && S.trQs.length>0) {
    const q=S.trQs[S.trCi], tl={issue:'論点発見',article:'条文番号',require:'要件チェック',short:'短文論述',tf:'正誤判断'}[q.t];
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › <span class="tg tg-o">'+tl+'</span></div>';
    h += '<div class="pbar"><div class="pfill pft" style="width:'+((S.trCi+(S.trDone?1:0))/S.trQs.length*100)+'%"></div></div>';
    h += '<div class="qh"><span class="qn">第'+(S.trCi+1)+'問/'+S.trQs.length+'</span><span class="qs">正解'+S.trScore+'</span></div>';
    h += '<div class="qt">'+esc(q.q)+'</div>';
    if (q.t==='tf') {
      const c0=!S.trDone?(S.trSel.includes(0)?'ch sel':'ch'):(q.ans?'ch ok':'ch ng'+(S.trSel.includes(0)?' lk':''));
      const c1=!S.trDone?(S.trSel.includes(1)?'ch sel':'ch'):(!q.ans?'ch ok':'ch ng'+(S.trSel.includes(1)?' lk':''));
      h += '<div class="chs"><button class="'+(!S.trDone?(S.trSel.includes(0)?'ch sel':'ch'):(q.ans===true?'ch ok lk':(S.trSel.includes(0)?'ch ng lk':'ch lk')))+'" onclick="if(!S.trDone){S.trSel=[0];render();}"><span class="mk">○</span><span>正しい</span></button>';
      h += '<button class="'+(!S.trDone?(S.trSel.includes(1)?'ch sel':'ch'):(q.ans===false?'ch ok lk':(S.trSel.includes(1)?'ch ng lk':'ch lk')))+'" onclick="if(!S.trDone){S.trSel=[1];render();}"><span class="mk">×</span><span>誤り</span></button></div>';
    } else if (q.t==='short') {
      h += '<textarea class="ta ta-sm" id="trans" placeholder="2-3文で記述..." '+(S.trDone?'readonly':'')+'>'+esc(S.trAns)+'</textarea>';
      if(S.trDone) h += '<div class="mdl"><div class="ml2">模範解答</div>'+esc(q.model)+'</div>';
    } else {
      h += '<div class="chs">';
      q.opts.forEach((o,i) => {
        let cls='ch';
        if(!S.trDone){cls=S.trSel.includes(i)?'ch sel':'ch';}
        else{const isAns=Array.isArray(q.ans)?q.ans.includes(i):q.ans===i;if(isAns)cls='ch ok lk';else if(S.trSel.includes(i))cls='ch ng lk';else cls='ch lk';}
        const onclick=q.t==='article'?'if(!S.trDone){S.trSel=['+i+'];render();}':'trToggle('+i+')';
        h += '<button class="'+cls+'" onclick="'+onclick+'"><span class="mk">'+(q.t==='article'?'①②③④⑤'[i]:(S.trSel.includes(i)?'✓':' '))+'</span><span>'+esc(o)+'</span></button>';
      });
      h += '</div>';
    }
    if(S.trDone&&q.t!=='short') {
      const ok=S.trHist[S.trHist.length-1]?.correct;
      h += '<div class="exp '+(ok?'eok':'eng')+'"><div class="el">'+(ok?'⭕ 正解':'❌ 不正解')+'</div><div>'+esc(q.ex)+'</div>'+lawRefHTML(q.laws)+'</div>';
    }
    h += '<div class="br">';
    if(!S.trDone) h += '<button class="btn bor" onclick="'+(q.t==='short'?'S.trAns=document.getElementById(\'trans\').value;':'')+'trConfirm()" '+(q.t==='short'?'':'disabled="'+(S.trSel.length===0)+'"')+'>'+(q.t==='short'?'確認':'解答')+'</button>';
    else h += '<button class="btn bp" onclick="trNext()">'+(S.trCi+1>=S.trQs.length?'結果':'次へ →')+'</button>';
    h += '</div>';

  } else if (S.view==='trRes') {
    const total=S.trQs.filter(q=>q.t!=='short').length;
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › 練習結果</div>';
    h += '<div class="rc"><div class="rs">'+S.trScore+'<span>/'+total+'</span></div><div class="rl">選択問題正解数</div></div>';
    h += '<div class="ctr"><button class="btn bo" onclick="goHome()">ホーム</button><button class="btn bor" onclick="go(\'trMenu\')">もう一度</button></div>';

  } else if (S.view==='quiz2' && S.qs.length>0) {
    const q=S.qs[S.ci], items=q.t==='combo'?q.c:q.ch;
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › <span class="tg tg-b">2級</span> <span class="tmr" id="timer">⏱'+fmt(S.elapsed)+'</span></div>';
    h += '<div class="pbar"><div class="pfill pf2" style="width:'+((S.ci+(S.answered?1:0))/S.qs.length*100)+'%"></div></div>';
    h += '<div class="qh"><span class="qn">第'+(S.ci+1)+'問/'+S.qs.length+' '+(q.t==='combo'?'<span class="tg tg-y">組み合わせ</span>':q.t==='scenario'?'<span class="tg tg-g">事例</span>':'<span class="tg tg-b">単答</span>')+'</span><span class="qs">正解'+S.score+' | '+q.a+'</span></div>';
    h += '<div class="qt">'+esc(q.q)+'</div>';
    if(q.t==='combo') { h += '<div class="stmts">'; q.s.forEach((s,i)=>h+='<div class="stm">'+esc(s)+'</div>'); h += '</div>'; }
    h += '<div class="chs">';
    items.forEach((c,i) => {
      let cls='ch';
      if(!S.answered){cls=S.sel===i?'ch sel':'ch';}else{if(i===q.ans)cls='ch ok lk';else if(i===S.sel)cls='ch ng lk';else cls='ch lk';}
      h += '<button class="'+cls+'" onclick="if(!S.answered){S.sel='+i+';render();}"><span class="mk">'+(q.t==='combo'?(i+1):'①②③④'[i])+'</span><span>'+esc(c)+'</span></button>';
    });
    h += '</div>';
    if(S.answered){const ok=S.hist[S.hist.length-1]?.ok;h+='<div class="exp '+(ok?'eok':'eng')+'"><div class="el">'+(ok?'⭕ 正解':'❌ 不正解')+'</div><div>'+esc(q.ex)+'</div>'+lawRefHTML(q.laws)+'</div>';}
    h += '<div class="br">';
    if(!S.answered) h += '<button class="btn bp" onclick="confirm2()" '+(S.sel===null?'disabled':'')+ '>解答</button>';
    else h += '<button class="btn bp" onclick="next2()">'+(S.ci+1>=S.qs.length?'結果を見る':'次の問題へ →')+'</button>';
    h += '</div>';

  } else if (S.view==='quiz1' && S.g1qs.length>0) {
    const q=S.g1qs[S.g1ci];
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › <span class="tg tg-r">1級</span> <span class="tmr" id="timer">⏱'+fmt(S.elapsed)+'</span></div>';
    h += '<div class="pbar"><div class="pfill pf1" style="width:'+((S.g1ci+1)/S.g1qs.length*100)+'%"></div></div>';
    h += '<div class="qh"><span class="qn">'+esc(q.title)+'</span></div>';
    h += '<div class="qt">'+esc(q.scenario)+'</div>';
    q.subQs.forEach((sq,i) => {
      h += '<div class="sq">'+esc(sq)+'</div>';
      h += '<textarea class="ta" id="essay'+i+'" placeholder="論述解答を入力...">'+esc(S.essay[i])+'</textarea>';
    });
    h += '<div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap">';
    if(!S.showMdl) h += '<button class="btn bo" onclick="S.showMdl=true;render();">模範解答</button>';
    if(S.apiKey&&!S.gradeRes) h += '<button class="btn bg" onclick="[0,1,2].forEach(i=>{const el=document.getElementById(\'essay\'+i);if(el)S.essay[i]=el.value;});doGrade();" '+(S.grading?'disabled':'')+'>🤖 '+(S.grading?'添削中...':'AI添削')+'</button>';
    h += '<button class="btn bp" onclick="[0,1,2].forEach(i=>{const el=document.getElementById(\'essay\'+i);if(el)S.essay[i]=el.value;});next1();">'+(S.g1ci+1>=S.g1qs.length?'終了':'次へ →')+'</button>';
    h += '</div>';
    if(S.showMdl) h += '<div class="mdl"><div class="ml2">模範解答</div>'+esc(q.modelAns)+'</div>';
    if(S.gradeRes&&!S.gradeRes.error){
      const g=S.gradeRes;
      h += '<div class="grd"><div class="ml2" style="color:var(--bl)">🤖 AI添削結果</div>';
      h += '<div class="gs"><span class="gsc">'+g.totalScore+'</span><span class="gsu">/50点</span>';
      h += '<span class="glv glv-'+g.passLevel+'">'+({A:'合格水準',B:'あと一歩',C:'基礎力不足',D:'要学習'}[g.passLevel]||'')+'</span></div>';
      if(g.breakdown)h+='<div class="gbd"><div>法的根拠:'+g.breakdown.legalBasis+'/15</div><div>あてはめ:'+g.breakdown.application+'/15</div><div>論理構成:'+g.breakdown.logic+'/10</div><div>結論:'+g.breakdown.conclusion+'/10</div></div>';
      (g.subEvals||[]).forEach(se=>{h+='<div class="gse"><div style="font-weight:700">小問'+se.subQ+'('+se.score+'点)</div>';if(se.strengths)h+='<div>👍 '+esc(se.strengths)+'</div>';if(se.weaknesses)h+='<div style="color:var(--ng)">⚠ '+esc(se.weaknesses)+'</div>';if(se.missingPoints)h+='<div style="color:var(--gd)">📋 '+esc(se.missingPoints)+'</div>';h+='</div>';});
      if(g.overallComment)h+='<div style="margin-top:10px;padding:10px;background:#f8f6f0;border-radius:6px;font-size:13px;line-height:1.8"><b>総合講評:</b> '+esc(g.overallComment)+'</div>';
      h+='</div>';
    }
    if(S.gradeRes?.error)h+='<div class="exp eng"><div class="el">APIエラー</div><div>'+esc(S.gradeRes.error)+'</div></div>';

  } else if (S.view==='res2') {
    const pct=S.qs.length?Math.round(S.score/S.qs.length*100):0;
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › 2級結果</div>';
    h += '<div class="rc"><div class="rs">'+S.score+'<span>/'+S.qs.length+'</span></div>';
    h += '<div class="rl">'+Math.round(S.score*2.5)+'点/'+Math.round(S.qs.length*2.5)+'点</div>';
    h += '<div class="rp '+(pct>=70?'rph':pct>=40?'rpm':'rpl')+'">'+pct+'%'+(pct>=70?' 合格ライン到達':'')+'</div>';
    h += '<div class="rm">所要時間: '+fmt(S.elapsed)+'</div></div>';
    h += '<div class="stitle">解答一覧（タップで解説＋条文参照）</div>';
    h += '<div class="rvl">';
    S.qs.forEach((q,i)=>{h+='<div class="rvi" onclick="S.revI=S.revI==='+i+'?null:'+i+';render();"><span class="rvd '+(S.hist[i]?.ok?'ok':'ng')+'"></span><span class="rvt">問'+(i+1)+' ['+q.a+'] '+esc(q.q.substring(0,30))+'…</span><span style="color:#999">'+(S.revI===i?'▲':'▼')+'</span></div>';});
    h += '</div>';
    if(S.revI!==null){const q=S.qs[S.revI];h+='<div class="rvp"><div class="qt">'+esc(q.q)+'</div>';if(q.t==='combo'){h+='<div class="stmts">';q.s.forEach(s=>h+='<div class="stm">'+esc(s)+'</div>');h+='</div>';}h+='<div class="exp '+(S.hist[S.revI]?.ok?'eok':'eng')+'"><div class="el">'+(S.hist[S.revI]?.ok?'⭕':'❌')+'</div><div>'+esc(q.ex)+'</div>'+lawRefHTML(q.laws)+'</div></div>';}
    h += '<div class="ctr"><button class="btn bo" onclick="goHome()">ホーム</button><button class="btn bp" onclick="start2(S.qs.length>15?\'full\':\'practice\')">再挑戦</button></div>';

  } else if (S.view==='res1') {
    h += '<div class="bc"><a onclick="goHome()">ホーム</a> › 1級完了</div>';
    h += '<div class="rc"><div style="font-family:\'Noto Serif JP\',serif;font-size:18px;font-weight:700">論述演習完了</div><div class="rl">'+S.g1qs.length+'問 | '+fmt(S.elapsed)+'</div></div>';
    S.g1qs.forEach((q,i)=>{
      h+='<div class="rvp" style="margin-bottom:14px"><div style="font-weight:700;margin-bottom:6px">'+esc(q.title)+'</div>';
      q.subQs.forEach((sq,j)=>{h+='<div class="sq" style="font-size:12px">'+esc(sq)+'</div><div style="padding:7px;background:#f0f4f8;border-radius:6px;font-size:12px;line-height:1.7;margin-bottom:5px;white-space:pre-wrap">'+esc(S.g1hist[i]?.essay?.[j]||'（未回答）')+'</div>';});
      if(S.g1hist[i]?.grade&&!S.g1hist[i].grade.error)h+='<div style="padding:7px;background:#e8f0fe;border-radius:6px;font-size:12px;margin-bottom:6px">AI: <b>'+S.g1hist[i].grade.totalScore+'/50点</b> ['+S.g1hist[i].grade.passLevel+']</div>';
      h+='<details><summary style="cursor:pointer;font-size:12px;color:var(--bl)">模範解答</summary><div class="mdl" style="margin-top:6px">'+esc(q.modelAns)+'</div></details></div>';
    });
    h += '<div class="ctr"><button class="btn bo" onclick="goHome()">ホーム</button></div>';
  }

  app.innerHTML = h;
}

// ═══ PWA & Offline ═══
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(e => console.log('SW error:', e));
}
window.addEventListener('online', () => { document.body.classList.remove('offline'); });
window.addEventListener('offline', () => { document.body.classList.add('offline'); });
if (!navigator.onLine) document.body.classList.add('offline');

// ═══ Boot ═══
loadData();
</script>
</body>
</html>
